<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="night.css"><style>
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
h2{font-size:62px;line-height:1.05}
.dim{color:var(--t3)}
.flow{display:flex;align-items:center;gap:26px;font:500 22px Mono,monospace;margin-top:24px}
.n{padding:16px 24px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.gap{width:200px;height:2px;background:linear-gradient(90deg,var(--bad),transparent 50%,var(--bad));position:relative}
.gap:after{content:"nothing here";position:absolute;top:-30px;left:0;right:0;font-size:15px;color:var(--bad);letter-spacing:.1em}
</style></head><body>
<div class="wash" style="left:50%;top:50%;transform:translate(-50%,-50%);width:900px;height:600px"></div>
<div class="wrap">
 <h2 class="in" style="animation-delay:.25s">Both agents <span class="dim">decided for themselves.</span></h2>
 <div class="flow in" style="animation-delay:2.2s"><span class="n">The decision</span><span class="gap"></span><span class="n" style="color:#ffb3aa;border-color:#6b2a24">The money</span></div>
</div></body></html>
