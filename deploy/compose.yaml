# Aerar on a single VPS: Postgres + app + Caddy (automatic HTTPS).
# Run from the repo root:  docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerar
      POSTGRES_DB: aerar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerar -d aerar"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://aerar:${POSTGRES_PASSWORD}@db:5432/aerar
      DEMO_PROVIDER_HOST: ${AERAR_DOMAIN:?set AERAR_DOMAIN in deploy/.env}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AERAR_DOMAIN: ${AERAR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
